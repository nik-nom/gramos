<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c56a3" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="अधिकृत ग्रामपंचायत संकेतस्थळ — लोकसेवा, बातम्या, योजना आणि संपर्क माहिती." />
  <title>ग्रामपंचायत — अधिकृत संकेतस्थळ</title>
  <link rel="icon" href="/assets/gp-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=6.9.3" />
  <link rel="modulepreload" href="/src/main.js?v=6.10.0" />
  <link rel="modulepreload" href="/src/public.js?v=6.10.0" />
  <link rel="modulepreload" href="/src/public-read.js?v=6.10.0" />
</head>
<body>
  <div id="app"><div role="status" aria-live="polite" style="max-width:38rem;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif"><h1>ग्रामपंचायत संकेतस्थळ</h1><p id="gramos-boot-status" hidden></p></div></div>
  <script id="gramos-inline-bootstrap">
  (function(){
    'use strict';
    var app=document.getElementById('app'), done=false, timer;
    window.GRAMOS_BOOT_STAGE='Loading browser configuration';
    function fail(message,error){
      if(done)return;done=true;clearTimeout(timer);
      console.error('GramOS v6.10.0 startup:',message,error||'');
      var box=document.createElement('section');box.style.cssText='max-width:38rem;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;overflow-wrap:anywhere';
      var title=document.createElement('h1');title.textContent='संकेतस्थळ सध्या उपलब्ध नाही';
      var detail=document.createElement('p');detail.textContent=message;
      var stage=document.createElement('p');stage.textContent='Version 6.10.0 — '+window.GRAMOS_BOOT_STAGE;
      var retry=document.createElement('button');retry.type='button';retry.textContent='Retry';retry.onclick=function(){location.reload();};
      box.append(title,detail,stage,retry);app.replaceChildren(box);
    }
    function loadConfig(){return new Promise(function(resolve,reject){
      if(window.GRAMOS_CONFIG){resolve();return;}
      var script=document.createElement('script');var configTimer=setTimeout(function(){script.remove();reject(new Error('config.js did not respond'));},8000);
      function finish(error){clearTimeout(configTimer);if(error)reject(error);else resolve();}
      script.onload=function(){finish(window.GRAMOS_CONFIG?null:new Error('config.js did not define GRAMOS_CONFIG'));};
      script.onerror=function(){finish(new Error('config.js could not be loaded'));};
      script.src='/config.js?v=6.9.3';document.head.appendChild(script);
    });}
    timer=setTimeout(function(){fail('Startup timed out. Send a screenshot of this message to your administrator.');},42000);
    var isDemo=/^\/demo(?:\/|$)/.test(location.pathname);
    (isDemo?Promise.resolve():loadConfig()).then(function(){
      if(done)return;
      window.GRAMOS_BOOT_STAGE='Loading application modules';
      var db=window.GRAMOS_CONFIG&&window.GRAMOS_CONFIG.supabaseUrl;if(db&&/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(db)){var pre=document.createElement('link');pre.rel='preconnect';pre.href=db;pre.crossOrigin='anonymous';document.head.appendChild(pre);}
      import('/src/public-read.js?v=6.10.0').catch(function(){});

      var status=document.getElementById('gramos-boot-status');if(status)status.textContent='Loading application modules…';
      return import('/src/main.js?v=6.10.0').then(function(module){
        if(!module.initialRender)throw new Error('Old application module served; verify the deployment');
        return module.initialRender;
      });
    }).then(function(){if(done)return;done=true;clearTimeout(timer);}).catch(function(error){fail(error.message||'A required startup file failed to load.',error);});
  })();
  </script>
  <noscript>हे संकेतस्थळ वापरण्यासाठी JavaScript आवश्यक आहे.</noscript>
</body>
</html>
